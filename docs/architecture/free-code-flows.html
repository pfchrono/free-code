<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free-Code Workflow Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f0e7;
      --panel: #fffdf8;
      --ink: #182226;
      --muted: #627176;
      --line: #d7cebd;
      --soft: #ebe4d7;
      --active: #245d76;
      --active-soft: #dcecf1;
      --route: #a06b1c;
      --route-soft: #fff0d5;
      --shadow: 0 12px 34px rgba(40, 34, 23, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.42;
    }

    header {
      padding: 34px clamp(16px, 4vw, 48px) 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8, #f4f0e7);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .lede {
      max-width: 1120px;
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    main {
      display: grid;
      gap: 18px;
      padding: 18px clamp(16px, 4vw, 48px) 44px;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 390px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 14px 16px;
      background: var(--soft);
      border-bottom: 1px solid var(--line);
      font-size: 1rem;
      letter-spacing: 0;
    }

    .actions {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font: inherit;
      padding: 8px 10px;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      background: var(--active);
      border-color: var(--active);
      color: white;
    }

    .map-wrap {
      position: relative;
      min-height: 350px;
      padding: 14px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .component-map {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: stretch;
      gap: 14px;
      min-width: max-content;
      padding: 26px 18px 34px;
    }

    .component {
      flex: 0 0 210px;
      min-height: 118px;
      border: 1px solid var(--line);
      border-left-width: 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .component.flow-instance {
      min-height: 142px;
    }

    .component.flow-instance::before {
      content: attr(data-step);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      min-width: 28px;
      height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      background: var(--route);
      color: white;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .component.inventory-break {
      margin-left: 34px;
    }

    .component.inventory::before {
      content: attr(data-step);
      align-self: flex-start;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .component.active {
      background: var(--active-soft);
      border-color: var(--active);
      transform: translateY(-2px);
    }

    .component.dim {
      opacity: 0.42;
    }

    .component.route-source,
    .component.route-target {
      box-shadow: inset 0 0 0 2px rgba(160, 107, 28, 0.45);
    }

    .component strong {
      font-size: 0.94rem;
    }

    .component .package {
      color: var(--active);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      overflow-wrap: anywhere;
    }

    .component p {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .group-entry { border-left-color: #315c7d; }
    .group-surface { border-left-color: #3f7a5b; }
    .group-registry { border-left-color: #64528a; }
    .group-dispatch { border-left-color: #a66f23; }
    .group-state { border-left-color: #69757a; }
    .group-core { border-left-color: #15191c; }
    .group-integration { border-left-color: #a14c44; }
    .group-tooling { border-left-color: #45728e; }
    .group-memory { border-left-color: #7a4d2b; }
    .group-storage { border-left-color: #51655b; }
    .group-remote { border-left-color: #7c5b8c; }
    .group-async { border-left-color: #8a6b28; }
    .group-exit { border-left-color: #2f6b52; }

    svg.routes {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .flow-detail {
      display: grid;
      gap: 12px;
      padding: 12px;
      max-height: 820px;
      overflow: auto;
    }

    .flow-title {
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .flow-title h3 {
      margin: 0 0 6px;
      letter-spacing: 0;
    }

    .flow-title p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .step {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .routine-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .routine-node {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid #ead1a0;
      border-radius: 8px;
      background: var(--route-soft);
      color: #624417;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .step-head {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--route);
      color: white;
      font-size: 0.8rem;
      flex: 0 0 auto;
    }

    .route-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--active);
      font-size: 0.78rem;
      background: var(--active-soft);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .step h4 {
      margin: 0;
      font-size: 0.96rem;
      letter-spacing: 0;
    }

    .step p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .passes {
      color: var(--ink);
      background: var(--route-soft);
      border: 1px solid #ead1a0;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.84rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 4px 9px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--active);
    }

    .files {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 8px;
    }

    .file-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }

    .file-card strong {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .file-card code {
      display: block;
      color: var(--active);
      font-size: 0.76rem;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1250px) {
      .shell {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .details-panel {
        grid-column: 1 / -1;
      }

      .component-map {
        grid-template-columns: repeat(4, minmax(145px, 1fr));
      }
    }

    @media (max-width: 820px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .component-map {
        grid-template-columns: repeat(2, minmax(145px, 1fr));
      }
    }

    @media (max-width: 520px) {
      main,
      header {
        padding-left: 12px;
        padding-right: 12px;
      }

      .component-map {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Free-Code Workflow Explorer</h1>

        <div class="legend" id="legend"></div>
        <div class="map-wrap" id="mapWrap">
          <svg class="routes" id="routesSvg" aria-hidden="true"></svg>
          <div class="component-map" id="componentMap"></div>
        </div>
      </section>

      <aside class="panel details-panel">
        <h2>Selected Flow</h2>
        <div class="flow-detail" id="flowDetail"></div>
      </aside>
    </section>

    <section class="panel">
      <h2>Source Files For Highlighted Components</h2>
      <div class="files" id="files"></div>
    </section>
  </main>

          "from": "engine",
          "to": "query",
          "title": "Run core loop",
          "passes": "SDK-compatible message stream, mutable transcript, ToolUseContext.",
          "notes": "Harness observes emitted messages instead of rendering REPL UI."
        },
        {
          "from": "query",
          "to": "api",
          "title": "Model call",
          "passes": "Normalized prompt and tools.",
          "notes": "Tests can mock or exercise provider path depending on harness scenario."
        },
        {
          "from": "query",
          "to": "output",
          "title": "Collect result",
          "passes": "SDK messages, assistant response, tool events, status.",
          "notes": "Harness exposes messages through getMessages/readFileState helpers."

      ]
    },
    {
      "id": "slash-command",
      "label": "Slash command",
      "description": "Interactive slash command such as /compact, /status, /model, or custom skill commands.",
      "highlight": ["repl", "commands", "slash", "state", "tools", "compact", "engine", "query", "output"],
      "steps": [
        {
          "from": "repl",
          "to": "slash",
          "title": "Detect command input",

        {
          "from": "slash",
          "to": "commands",
          "title": "Resolve command",

    {
      "id": "skill-shortcut",

      "steps": [
        {
          "from": "repl",
          "to": "slash",
          "title": "Detect inline skill shortcut",

          "from": "slash",

        {
          "from": "slash",

        {
          "from": "engine",
          "to": "query",

          "from": "query",
          "to": "toolExec",

        {
          "from": "query",
          "to": "persist",

        {
          "from": "query",
          "to": "output",
          "title": "Render skill result",
          "passes": "Assistant response, tool results, command-loading breadcrumbs, errors, usage.",

    },
    {
      "id": "headless-prompt",

      "steps": [

    {

        {

        {

          "to": "state",

        },
        {
          "from": "toolExec",
          "to": "builtInTools",
          "title": "Run built-in tool",
          "passes": "Typed tool input plus ToolUseContext.",
          "notes": "File, shell, agent, skill, and search tools update runtime state as needed."
        },
        {
          "from": "toolExec",
          "to": "mcpTools",
          "title": "Or call MCP/SDK tool",
          "passes": "MCP tool name, server/client handle, input schema payload.",

        },
        {
          "from": "toolExec",
          "to": "query",

        },
        {
          "from": "toolExec",
          "to": "output",
          "title": "Surface progress",
          "passes": "Tool progress/status messages, summaries, notifications.",
          "notes": "REPL/GUI/headless show progress differently but consume same event concepts."

    },
    {
      "id": "compaction",
      "label": "Compaction",
      "description": "Manual or automatic context reduction while preserving useful state.",
      "highlight": ["query", "compact", "hooks", "api", "persist", "state", "output"],
      "steps": [
        {
          "from": "query",
          "to": "compact",
          "title": "Trigger compact",
          "passes": "Messages, token estimates, trigger type, custom instructions, cache-safe params.",

        {
          "from": "compact",
          "to": "hooks",

        {

          "to": "api",

          "from": "compact",
          "to": "state",
          "title": "Restore important state",
          "passes": "Read-file cache, plan state, agent listing, MCP instruction deltas, invoked skills.",

        },
        {
          "from": "compact",
          "to": "persist",
          "title": "Write compact snapshot",
          "passes": "Boundary marker, summary message, kept messages, attachments, hook results, token metadata.",
          "notes": "Resume loads compacted core/visible messages instead of full pre-compact history."
        },
        {
          "from": "compact",
          "to": "query",
          "title": "Continue with compacted history",
          "passes": "buildPostCompactMessages() output.",
          "notes": "query() resumes model call using smaller context."

      ]
    },
    {
      "id": "mcp-change",
      "label": "MCP tool change",
      "description": "Adding, enabling, disabling, or reconnecting MCP/SDK servers during a session.",
      "highlight": ["headless", "gui", "mcp", "state", "tools", "commands", "query", "output"],
      "steps": [
        {
          "from": "output",

        {
          "from": "mcp",
          "to": "state",
          "title": "Update runtime MCP state",

          "from": "state",

        {

      "id": "resume",

      "highlight": ["cli", "commands", "persist", "state", "repl", "headless", "compact", "output"],
      "steps": [
        {
          "from": "cli",
          "to": "commands",

        },
        {
          "from": "persist",
          "to": "state",
          "title": "Rehydrate runtime hints",
          "passes": "Messages, compact markers, read-file state hints, prompt counts, mode flags.",

          "from": "state",

          "from": "state",

    {

          "notes": "Remote side sees progress without owning local task execution."
        },
        {
          "from": "bridge",

  "groups": [
    { "id": "entry", "label": "Entry" },
    { "id": "surface", "label": "Surfaces" },

    { "id": "integration", "label": "Integrations" },
    { "id": "tooling", "label": "Tools" },
    { "id": "memory", "label": "Memory" },
    { "id": "storage", "label": "Storage" },

  </script>

  <script>
    let currentData = null;
    let currentAction = null;

    async function loadData() {
      const fallback = JSON.parse(document.getElementById('fallback-data').textContent);
      try {
        const response = await fetch('free-code-flows.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (_error) {
        return fallback;
      }
    }

    function byId(items) {
      return new Map(items.map(item => [item.id, item]));
    }

    function renderActions(data) {
      const actions = document.getElementById('actions');
      actions.innerHTML = '';
      for (const action of data.actions) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = action.label;
        button.setAttribute('aria-pressed', String(action.id === currentAction.id));
        button.addEventListener('click', () => selectAction(action.id));
        actions.appendChild(button);
      }
    }

    function renderLegend(data) {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      for (const group of data.groups) {
        const item = document.createElement('span');
        item.innerHTML = `<i class="dot"></i>${group.label}`;
        legend.appendChild(item);
      }
    }

    function involvedIds(action) {
      const ids = new Set(action.highlight || []);
      for (const step of action.steps || []) {
        ids.add(step.from);
        ids.add(step.to);
      }
      return ids;
    }

    function routeEndpoints(action) {
      const sources = new Set();
      const targets = new Set();
      for (const step of action.steps || []) {
        sources.add(step.from);
        targets.add(step.to);
      }
      return { sources, targets };
    }

    function orderedFlowIds(action) {
      const steps = action.steps || [];
      if (!steps.length) return [];
      return [steps[0].from, ...steps.map(step => step.to)];
    }

    function renderComponents(data) {
      const map = document.getElementById('componentMap');
      const components = byId(data.components);
      const active = involvedIds(currentAction);
      const endpoints = routeEndpoints(currentAction);
      const flowIds = orderedFlowIds(currentAction);
      const flowSet = new Set(flowIds);
      map.innerHTML = '';

      for (const [index, id] of flowIds.entries()) {
        const component = components.get(id);
        if (!component) continue;

        const card = document.createElement('article');
        card.id = `flow-node-${index}`;
        card.dataset.componentId = component.id;
        card.dataset.step = index === 0 ? 'Start' : String(index);
        card.className = [
          'component',
          'flow-instance',
          `group-${component.group}`,
          'active',
          index === 0 || endpoints.sources.has(component.id) ? 'route-source' : '',
          index === flowIds.length - 1 || endpoints.targets.has(component.id) ? 'route-target' : ''
        ].filter(Boolean).join(' ');
        const note = index === 0 ? 'Flow starts here.' : currentAction.steps[index - 1]?.title || component.description;
        card.innerHTML = `
          <strong>${component.label}</strong>
          <span class="package">${component.package}</span>
          <p>${note}</p>
        `;
        map.appendChild(card);
      }

      const inventory = data.components.filter(component => !flowSet.has(component.id));
      for (const [index, component] of inventory.entries()) {
        const card = document.createElement('article');
        const isActive = active.has(component.id);
        card.id = `component-${component.id}`;
        card.dataset.step = isActive ? 'Context' : 'Other';
        card.className = [
          'component',
          'inventory',
          index === 0 ? 'inventory-break' : '',
          `group-${component.group}`,
          isActive ? 'active' : 'dim'
        ].filter(Boolean).join(' ');
        card.innerHTML = `
          <strong>${component.label}</strong>
          <span class="package">${component.package}</span>
          <p>${component.description}</p>
        `;
        map.appendChild(card);
      }
    }

    function drawRoutes() {
      const wrap = document.getElementById('mapWrap');
      const svg = document.getElementById('routesSvg');
      const width = Math.max(wrap.scrollWidth, wrap.clientWidth);
      const height = Math.max(wrap.scrollHeight, wrap.clientHeight);
      const wrapRect = wrap.getBoundingClientRect();
      svg.style.width = `${width}px`;
      svg.style.height = `${height}px`;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#a06b1c"></path>
          </marker>
        </defs>
      `;

      const flowIds = orderedFlowIds(currentAction);
      for (let index = 0; index < flowIds.length - 1; index += 1) {
        const from = document.getElementById(`flow-node-${index}`);
        const to = document.getElementById(`flow-node-${index + 1}`);
        if (!from || !to) continue;

        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        const x1 = a.right - wrapRect.left + wrap.scrollLeft;
        const y1 = a.top + a.height / 2 - wrapRect.top + wrap.scrollTop;
        const x2 = b.left - wrapRect.left + wrap.scrollLeft;
        const y2 = b.top + b.height / 2 - wrapRect.top + wrap.scrollTop;
        const mid = Math.max(28, Math.abs(x2 - x1) * 0.42);
        const c1x = x1 + mid;
        const c2x = x2 - mid;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#a06b1c');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('marker-end', 'url(#arrow)');
        path.setAttribute('opacity', '0.78');
        svg.appendChild(path);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', String((x1 + x2) / 2));
        label.setAttribute('y', String((y1 + y2) / 2 - 5));
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-size', '12');
        label.setAttribute('font-family', 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace');
        label.setAttribute('fill', '#6f4b18');
        label.textContent = String(index + 1);
        svg.appendChild(label);
      }
    }

    function renderFlowDetail(data) {
      const components = byId(data.components);
      const detail = document.getElementById('flowDetail');
      const routinePath = [];
      for (const step of currentAction.steps || []) {
        if (!routinePath.includes(step.from)) routinePath.push(step.from);
        if (!routinePath.includes(step.to)) routinePath.push(step.to);
      }
      const routineNodes = routinePath
        .map(id => `<span class="routine-node">${components.get(id)?.label || id}</span>`)
        .join('');
      detail.innerHTML = `
        <section class="flow-title">
          <h3>${currentAction.label}</h3>
          <p>${currentAction.description}</p>
        </section>
        <section class="routine-strip" aria-label="Subroutine path">${routineNodes}</section>
      `;

      for (const [index, step] of currentAction.steps.entries()) {
        const from = components.get(step.from)?.label || step.from;
        const to = components.get(step.to)?.label || step.to;
        const item = document.createElement('article');
        item.className = 'step';
        item.innerHTML = `
          <div class="step-head">
            <span class="step-num">${index + 1}</span>
            <span class="route-label">${from} -> ${to}</span>
          </div>
          <h4>${step.title}</h4>
          <div class="passes">${step.passes}</div>
          <p>${step.notes}</p>
        `;
        detail.appendChild(item);
      }
    }

    function renderFiles(data) {
      const active = involvedIds(currentAction);
      const files = document.getElementById('files');
      files.innerHTML = '';

      for (const component of data.components.filter(component => active.has(component.id))) {
        const card = document.createElement('article');
        card.className = 'file-card';
        const fileList = component.files.map(file => `<code>${file}</code>`).join('');
        card.innerHTML = `<strong>${component.label}</strong>${fileList}`;
        files.appendChild(card);
      }
    }

    function selectAction(actionId) {
      currentAction = currentData.actions.find(action => action.id === actionId) || currentData.actions[0];
      renderActions(currentData);
      renderComponents(currentData);
      renderFlowDetail(currentData);
      renderFiles(currentData);
      requestAnimationFrame(drawRoutes);
    }

    function render(data) {
      currentData = data;
      currentAction = data.actions[0];
      document.title = data.title;
      document.getElementById('summary').textContent = data.summary;
      renderLegend(data);
      selectAction(currentAction?.id);
    }

    window.addEventListener('resize', () => {
      if (currentAction) requestAnimationFrame(drawRoutes);
    });

    document.getElementById('mapWrap').addEventListener('scroll', () => {
      if (currentAction) requestAnimationFrame(drawRoutes);
    });

    loadData().then(render);
  </script>
</body>
</html>
